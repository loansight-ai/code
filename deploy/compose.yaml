# Local development only. Credentials below are examples, not production secrets.
name: loansight

x-backend: &backend
  image: loansight-backend:dev
  build:
    context: ../backend
  restart: unless-stopped
  env_file:
    - path: ./backend.defaults.env
    - path: ../backend/.env
      required: false
  environment:
    # Keep Compose-internal endpoints even when the native .env uses localhost.
    LOANSIGHT_DATABASE_URL: postgresql+psycopg://loansight:local-example@db:5432/loansight
    LOANSIGHT_RABBITMQ_URL: amqp://loansight:local-example@rabbitmq:5672/
    LOANSIGHT_ARTIFACT_ROOT: /data/artifacts
    LOANSIGHT_COMPANY_SEED_CSV: /data/company-seed/companies_opendart_ksic11.csv
    LOANSIGHT_KSIC11_CODES_CSV: /data/company-seed/ksic11_codes.csv

services:
  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:${LOANSIGHT_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: loansight
      POSTGRES_USER: loansight
      POSTGRES_PASSWORD: local-example
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "loansight", "-d", "loansight"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: loansight
      RABBITMQ_DEFAULT_PASS: local-example
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    restart: "no"
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    volumes:
      - source-artifacts:/data/artifacts
      - ../opendart_ksic11_sync:/data/company-seed:ro
    ports:
      - "127.0.0.1:${LOANSIGHT_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4).close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *backend
    volumes:
      - source-artifacts:/data/artifacts
    command: ["/app/.venv/bin/python", "-m", "app.worker.main"]
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.core.runtime", "worker"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  outbox-relay:
    <<: *backend
    command: ["/app/.venv/bin/python", "-m", "app.messaging.outbox_relay"]
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.core.runtime", "relay"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  source-artifacts:
  postgres-data:
  rabbitmq-data:
