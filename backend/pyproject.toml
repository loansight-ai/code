[project]
name = "loansight-backend"
version = "0.1.0"
description = "LoanSight AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "pydantic>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "structlog>=25,<27",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = "==0.13.5"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
